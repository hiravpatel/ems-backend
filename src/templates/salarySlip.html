<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Slip</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }
        .header {
            text-align: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        th {
            background: #f5f5f5;
        }
        .sub-table th, .sub-table td {
            border: 1px dotted black;
        }
        .total-row th, .total-row td {
            font-weight: bold;
        }
        .no-border {
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Salary Slip</div>
        <p>{{MONTH_YEAR}}</p>
    </div>

    <table>
        <tr>
            <th>Name</th>
            <td>{{EMPLOYEE_NAME}}</td>
            <th>Employee ID</th>
            <td>{{EMPLOYEE_CODE}}</td>
        </tr>
        <tr>
            <th>Designation</th>
            <td>{{POSITION}}</td>
            <th>Department</th>
            <td>{{DEPARTMENT}}</td>
        </tr>
    </table>

    <table>
        <tr>
            <th>Earnings</th>
            <th>Amount</th>
        </tr>

        <!-- Earnings -->
        <tr>
            <td>Basic Salary</td>
            <td>₹ {{BASIC_SALARY}}</td>
        </tr>
        <tr>
            <td>Allowances</td>
            <td>₹ {{ALLOWANCES}}</td>
        </tr>
        <tr>
            <td>Deductions</td>
            <td>₹ {{DEDUCTION}}</td>
            
        </tr>
        <tr class="total-row">
            <td>Net Salary</td>
            <td>₹ {{NET_SALARY}}</td>
        </tr>
    </table>
</body>
</html>
