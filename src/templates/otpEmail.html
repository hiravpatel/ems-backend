<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
            border: 1px solid black;
        }
        .card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .card h5 {
            color: #555;
            margin-bottom: 20px;
            font-weight: normal;
        }
        .card p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .otp {
            display: inline-block;
            background-color: #e0f0ff;
            color: #007bff;
            font-weight: bold;
            font-size: 32px;
            padding: 15px 30px;
            border-radius: 10px;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
        .footer {
            font-size: 13px;
            color: #aaa;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="card">
            <h2>Complete registration</h2>
            <h5>Hello {{firstName}} </h5>
            <p>Your account has been created successfully! Use this password to log in for the first time. Do not share this OTP with anyone.</p>
            <div class="otp">{{otp}}</div>        
            <p>Thank You!</p>
            <div class="footer">&copy; All rights reserved.</div>
        </div>
    </div>
</body>
</html>
